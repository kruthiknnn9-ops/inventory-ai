<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inventory AI Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 40px auto; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 18px; margin: 12px 0; }
    button { padding: 8px 12px; cursor: pointer; }
    table { width:100%; border-collapse: collapse; }
    td,th { border:1px solid #ddd; padding:8px; text-align:left; }
  </style>
</head>
<body>
<h1>AI-Powered Inventory Dashboard</h1>
<div class="card">
  <h2>Inventory</h2>
  <table id="table"></table>
</div>
<div class="card">
  <h2>AI Prediction</h2>
  <select id="product"></select>
  <button onclick="predict()">Predict</button>
  <pre id="result"></pre>
</div>
<script>
async function load() {
  const data = await fetch('/api/inventory').then(r=>r.json());
  document.getElementById('table').innerHTML =
    '<tr><th>Product</th><th>Stock</th><th>Daily Sales</th><th>Reorder Level</th></tr>' +
    data.map(x => `<tr><td>${x.product_name}</td><td>${x.current_stock}</td><td>${x.daily_sales}</td><td>${x.reorder_level}</td></tr>`).join('');
  document.getElementById('product').innerHTML =
    data.map(x => `<option value="${x.product_id}">${x.product_name}</option>`).join('');
}
async function predict() {
  const id = document.getElementById('product').value;
  const data = await fetch('/api/predict/' + id).then(r=>r.json());
  document.getElementById('result').textContent = JSON.stringify(data, null, 2);
}
load();
</script>
</body>
</html>
